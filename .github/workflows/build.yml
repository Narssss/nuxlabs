name: Build NUX Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode sumber
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Terima Lisensi Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Siapkan local.properties
        run: |
          cp local.properties.example local.properties || touch local.properties
          sed -i "s|^sdk.dir=.*|sdk.dir=$ANDROID_HOME|g" local.properties
          grep -q "^sdk.dir=" local.properties || echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Beri izin eksekusi Gradle
        run: chmod +x gradlew

      - name: Compile Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: NUX-Launcher-NoLogin-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
